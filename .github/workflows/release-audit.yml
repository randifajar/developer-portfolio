name: Release Audit

# Manual only (TD 23.4). This gate is expected to FAIL for the whole of
# development, because release validation refuses Draft placeholder content —
# that refusal is the mechanism keeping placeholders out of production, not a
# defect. Running it on every push would train everyone to ignore a red check.
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Production site URL (absolute HTTPS)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  release-audit:
    name: release-audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Each step runs even if an earlier one failed, so a single dispatch
      # reports every launch blocker at once instead of surfacing them one run
      # at a time.
      - name: Release content validation
        id: release_validation
        if: always()
        env:
          SITE_URL: ${{ inputs.site_url }}
        run: npm run validate:release

      - name: Production dependency audit
        if: always()
        run: npm run audit:prod

      # Added after the first dispatch of this workflow, which revealed it had
      # never run check:links at all. The script itself did not exist either
      # until the same audit — release:check referenced a file nobody had
      # written, so the gate contained a step that could only ever crash.
      #
      # Needs network access, which is why it belongs here rather than in the
      # per-pull-request CI workflow.
      - name: Link validation
        id: link_validation
        if: always()
        run: npm run check:links

      - name: Install Playwright browsers
        if: always()
        run: npx playwright install --with-deps chromium firefox webkit

      - name: End-to-end and accessibility tests
        if: always()
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      # Lighthouse remains manual. Vercel is connected now, so the earlier note
      # here — that there was no deployment to point it at — is no longer the
      # reason. Automating it would mean adopting a third-party action to drive
      # Chrome, and github-configuration.md section 5 prefers pinned first-party
      # actions, so that is a decision to take deliberately rather than as a
      # side effect of this workflow. The procedure and the recorded scores are
      # in docs/release-audit.md.
      - name: Release audit summary
        if: always()
        run: |
          {
            echo "| Step | Outcome |"
            echo "| --- | --- |"
            echo "| Release content validation | ${{ steps.release_validation.outcome }} |"
            echo "| Link validation | ${{ steps.link_validation.outcome }} |"
            echo ""
            echo "Release content validation is EXPECTED to fail until launch content"
            echo "is complete. It failing is the gate working, not a defect."
            echo ""
            echo "Lighthouse and production smoke checks are performed manually"
            echo "against the deployed URL. See docs/release-audit.md."
          } >> "$GITHUB_STEP_SUMMARY"
