name: CI

# Two long-lived branches (CLAUDE.md, git-workflow.md section 2): `production`,
# the live site, and `staging`, where the next release is assembled before a
# single promotion pull request takes it live. Pull requests into either run
# the full gate, and so does every push to either, so the merged tree is checked
# as well as the branch — on `staging` that includes the sync merge from
# `production`, which is pushed rather than merged through a pull request.
# There is deliberately no `main` trigger — no such branch exists.
on:
  pull_request:
    branches: [production, staging]
  push:
    branches: [production, staging]

# Least privilege by default. A job needing more declares it itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job names are contractual: docs/governance/github-configuration.md section 4
  # lists `quality` and `e2e` as the required status checks, matched by exact
  # string. Renaming a job here silently detaches the branch ruleset.
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` installs strictly from the lock file, which is what makes the
      # build reproducible (NFAC-REL-004). `npm install` would silently resolve
      # newer versions and defeat that.
      - name: Install dependencies
        run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Content validation
        run: npm run validate:content

      - name: Unit and component tests
        run: npm run test:run

      - name: Production build
        run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --with-deps installs the system libraries WebKit and Firefox need on
      # Ubuntu. Without it WebKit fails to launch and the cross-browser
      # requirement in NFAC-COMPAT-001 goes silently unverified.
      #
      # Bounded and retried since 2026-11-21. Those libraries are 140 MB of apt
      # packages from the runner's Ubuntu mirror, fetched on every run, usually
      # in seconds. Some mirrors stay slow for a whole run: six runs from
      # 2026-11-18 to 2026-11-20 fetched at 50 to 300 kB/s, five of them from
      # us-east-2.ec2.archive.ubuntu.com. On PR #114 this step used up the
      # job's 25 minutes before any test ran, and GitHub reported the job as
      # "cancelled". A re-run installed in 64 seconds.
      #
      # So an attempt gets 270 seconds, twice the slowest of the 42 healthy
      # runs since 2026-11-15 (35 to 129 s), and up to three are made. apt
      # keeps the packages it finished downloading, so on a slow mirror the
      # attempts add up rather than start over. timeout-minutes caps the step
      # at 15, which leaves the tests at least 9 of the job's 25 minutes. If
      # every attempt runs out of time in apt, the mirror is the problem:
      # re-run the job.
      #
      # sudo forwards a signal only to the process it started, so a stopped
      # attempt can leave apt-get running as root with apt's lock held, or dpkg
      # half-done. Each attempt clears both first: a no-op the first time,
      # which keeps those commands exercised on every run.
      - name: Install Playwright browsers
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            sudo pkill -x apt-get || true
            while pgrep -x 'apt-get|dpkg' > /dev/null; do sleep 2; done
            sudo dpkg --configure -a
            timeout --kill-after=10s 270s npx playwright install --with-deps chromium firefox webkit && exit 0
            echo "::warning::Playwright browser install attempt $attempt of 3 exited with $? (124 means it ran out of time)."
          done
          echo "::error::Playwright browser install failed 3 times. If they ran out of time downloading apt packages, re-run the job."
          exit 1

      # Playwright's webServer config builds and starts the production server,
      # so the suite runs against what actually deploys rather than a dev build.
      - name: End-to-end and accessibility tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Added 2026-08-18. `audit:prod` previously ran only inside `release:check`
  # and `release-audit.yml`, both of which are manual — so a high-severity
  # advisory in `nanoid` reached `production` through thirteen consecutive
  # green CI runs and was found only when the v2 release gate was run by hand.
  #
  # Deliberately its own job rather than a step inside `quality`. `quality` and
  # `e2e` are the two required status checks, and a dependency audit fails for
  # a reason that has nothing to do with the pull request in front of it: an
  # advisory published upstream overnight would block every merge, including
  # the revert you would need during an incident. The 2026-08-17 rehearsal
  # recorded exactly that hazard.
  #
  # So this reports, loudly and on every change, without holding the merge
  # button hostage. Promote it to a required check only as a deliberate
  # decision, knowing what it costs.
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Production dependencies only. Dev-tool advisories do not ship to a
      # visitor, and failing on them would train everyone to ignore this job.
      - name: Production dependency audit
        run: npm run audit:prod
